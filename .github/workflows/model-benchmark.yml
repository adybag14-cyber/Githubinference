name: Manual CPU model benchmark

on:
  workflow_dispatch:
    inputs:
      model:
        description: Pinned target model
        required: true
        default: lfm2_5_2_6b_q4_k_m
        type: choice
        options:
          - lfm2_5_2_6b_q4_k_m
          - lfm2_5_1_2b_q4_k_m
          - gemma4_e2b_it_qat_q4_0
      enable_mtp:
        description: Use the pinned Gemma 4 MTP assistant (Gemma target only)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  PYTHONPATH: src

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODEL_ID: ${{ inputs.model }}
      ENABLE_MTP: ${{ inputs.enable_mtp }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Restore verified model cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/models
          key: cpu-benchmark-${{ runner.os }}-${{ env.MODEL_ID }}-${{ env.ENABLE_MTP }}-${{ hashFiles('config/models.json') }}
      - name: Benchmark real CPU inference
        shell: bash
        run: |
          set -euo pipefail
          llama_server="$(bash scripts/install_llama.sh .runtime/llama)"
          manual=()
          mtp=()
          if [[ "${MODEL_ID}" == "gemma4_e2b_it_qat_q4_0" ]]; then
            manual=(--allow-manual-model)
            if [[ "${ENABLE_MTP}" == "true" ]]; then mtp=(--enable-mtp); fi
          elif [[ "${ENABLE_MTP}" == "true" ]]; then
            echo "MTP is only valid for the pinned Gemma target" >&2
            exit 1
          fi
          python -m githubinference serve \
            --model-id "${MODEL_ID}" \
            --cache-directory .cache/models \
            --llama-server "${llama_server}" \
            "${manual[@]}" "${mtp[@]}" >llama-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            if kill -0 "${server_pid}" 2>/dev/null; then
              kill "${server_pid}"
            fi
            wait "${server_pid}" || true
          }
          trap cleanup EXIT
          python -m githubinference wait --timeout 360 --pid "${server_pid}"
          mkdir -p .runtime/benchmark
          python -m githubinference benchmark \
            --model-id "${MODEL_ID}" \
            --output .runtime/benchmark/result.json
          cp llama-server.log .runtime/benchmark/llama-server.log
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpu-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: .runtime/benchmark
          retention-days: 30
          if-no-files-found: warn
