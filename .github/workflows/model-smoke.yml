name: CPU model smoke

on:
  pull_request:
    paths:
      - "config/models.json"
      - "config/caretaker.json"
      - "scripts/install_llama.sh"
      - "src/githubinference/**"
      - ".github/workflows/model-smoke.yml"
  workflow_dispatch:
    inputs:
      model:
        description: Pinned automatic model to smoke test
        required: true
        default: lfm3_1_7b_q4_k_m
        type: choice
        options:
          - lfm3_1_7b_q4_k_m
          - lfm2_5_2_6b_q4_k_m
          - lfm2_5_1_2b_q4_k_m

permissions:
  contents: read

env:
  PYTHONPATH: src

concurrency:
  group: model-smoke-${{ github.ref }}-${{ inputs.model || 'lfm3_1_7b_q4_k_m' }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MODEL_ID: ${{ inputs.model || 'lfm3_1_7b_q4_k_m' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Restore verified model cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/models
          key: cpu-model-${{ runner.os }}-${{ env.MODEL_ID }}-${{ hashFiles('config/models.json') }}
      - name: Run real CPU inference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime/model-smoke
          build_started=${SECONDS}
          llama_server="$(bash scripts/install_llama.sh .runtime/llama)"
          printf 'source_build_seconds=%s\n' "$((SECONDS - build_started))" \
            > .runtime/model-smoke/resources.txt
          load_started=${SECONDS}
          python -m githubinference serve \
            --model-id "${MODEL_ID}" \
            --cache-directory .cache/models \
            --llama-server "${llama_server}" >llama-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            if kill -0 "${server_pid}" 2>/dev/null; then
              awk '/VmRSS:|VmHWM:/' "/proc/${server_pid}/status" \
                >> .runtime/model-smoke/resources.txt || true
              kill "${server_pid}"
            fi
            wait "${server_pid}" || true
          }
          trap cleanup EXIT
          python -m githubinference wait --timeout 240 --pid "${server_pid}"
          printf 'model_download_and_load_seconds=%s\n' "$((SECONDS - load_started))" \
            >> .runtime/model-smoke/resources.txt
          python -m githubinference smoke --model-id "${MODEL_ID}"
          python -m githubinference benchmark \
            --model-id "${MODEL_ID}" \
            --output .runtime/model-smoke/benchmark.json
          python -m githubinference snapshot \
            --root . \
            --repository "${GITHUB_REPOSITORY}" \
            --ref "${GITHUB_SHA}" \
            --output .runtime/model-smoke/snapshot.json
          python -m githubinference caretaker-smoke \
            --snapshot .runtime/model-smoke/snapshot.json \
            --model-id "${MODEL_ID}" \
            --output .runtime/model-smoke/caretaker-contract.json
          du -sk .runtime .cache/models >> .runtime/model-smoke/resources.txt
      - name: Upload model validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpu-model-smoke-${{ env.MODEL_ID }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .runtime/model-smoke
            llama-server.log
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
