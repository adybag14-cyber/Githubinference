name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: src

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify source import without third-party packages
        run: python -c "import githubinference; print(githubinference.__version__)"
      - name: Validate configuration
        run: python -m githubinference validate
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          if [[ -n "${BASE_SHA}" && ! "${BASE_SHA}" =~ ^0+$ ]]; then
            git diff --check "${BASE_SHA}" "${GITHUB_SHA}"
          elif git rev-parse --verify "${GITHUB_SHA}^" >/dev/null 2>&1; then
            git diff --check "${GITHUB_SHA}^" "${GITHUB_SHA}"
          else
            git diff-tree --check --root -r "${GITHUB_SHA}"
          fi
