name: Read-only CPU subagent

on:
  workflow_dispatch:
    inputs:
      parent_run:
        description: Parent caretaker run
        required: true
        type: string
      task_id:
        description: Deterministic task identifier
        required: true
        type: string
      task:
        description: Bounded analysis task
        required: true
        type: string
      scope_json:
        description: JSON array of path/topic boundaries
        required: true
        default: "[]"
        type: string

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

env:
  PYTHONPATH: src

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PARENT_RUN: ${{ inputs.parent_run }}
      TASK_ID: ${{ inputs.task_id }}
      TASK: ${{ inputs.task }}
      SCOPE_JSON: ${{ inputs.scope_json }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Restore verified model cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/models
          key: cpu-model-${{ runner.os }}-lfm2_5_2_6b_q4_k_m-${{ hashFiles('config/models.json') }}
      - name: Capture bounded repository state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -m githubinference snapshot
          --root .
          --repository "${GITHUB_REPOSITORY}"
          --ref "${GITHUB_SHA}"
          --github
          --output .runtime/subagent/snapshot.json
      - name: Run bounded read-only analysis
        shell: bash
        run: |
          set -euo pipefail
          llama_server="$(bash scripts/install_llama.sh .runtime/llama)"
          server_pid=""
          cleanup() {
            if [[ -n "${server_pid}" ]]; then
              if kill -0 "${server_pid}" 2>/dev/null; then
                kill "${server_pid}"
              fi
              wait "${server_pid}" || true
              server_pid=""
            fi
          }
          trap cleanup EXIT
          start_model() {
            local selected="$1"
            python -m githubinference serve \
              --model-id "${selected}" \
              --cache-directory .cache/models \
              --llama-server "${llama_server}" \
              >".runtime/subagent/llama-server-${selected}.log" 2>&1 &
            server_pid=$!
            if python -m githubinference wait --timeout 240 --pid "${server_pid}"; then
              return 0
            fi
            cleanup
            return 1
          }
          active_model="lfm2_5_2_6b_q4_k_m"
          if ! start_model "${active_model}"; then
            active_model="lfm2_5_1_2b_q4_k_m"
            echo "Primary failed; trying pinned low-memory fallback ${active_model}" >&2
            start_model "${active_model}"
          fi
          python -m githubinference subagent \
            --snapshot .runtime/subagent/snapshot.json \
            --model-id "${active_model}" \
            --task "${TASK}" \
            --scope-json "${SCOPE_JSON}" \
            --parent-run "${PARENT_RUN}" \
            --task-id "${TASK_ID}" \
            --output .runtime/subagent/result.json
      - name: Upload result for the next caretaker run
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: subagent-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: .runtime/subagent/result.json
          retention-days: 7
          if-no-files-found: warn
